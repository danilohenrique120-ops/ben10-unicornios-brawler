<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#dbeafe">
  <title>Super Punch 3D - Luva Mola!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #cfe3f6;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Screen-wide HUD Layer */
    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      z-index: 20;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .left-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    .btn-icon {
      width: clamp(48px, 6.2vw, 64px);
      height: clamp(48px, 6.2vw, 64px);
      background: linear-gradient(145deg, #38bdf8, #0284c7);
      border: 3px solid #ffffff;
      border-radius: 18px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(22px, 3vw, 30px);
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35), inset 0 2px 2px rgba(255,255,255,0.45);
      transition: transform 0.1s;
      text-decoration: none;
    }
    .btn-icon:active {
      transform: scale(0.92);
    }

    .level-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: clamp(6px, 1vw, 10px) clamp(18px, 3vw, 34px);
      border-radius: 999px;
      border: 3px solid #ffffff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
    }
    .level-num {
      font-size: clamp(19px, 2.7vw, 28px);
      font-weight: 900;
      color: #1e293b;
      line-height: 1.05;
    }
    .level-theme {
      font-size: clamp(11px, 1.4vw, 14px);
      font-weight: 800;
      color: #0284c7;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .coin-badge {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: clamp(8px, 1.2vw, 12px) clamp(14px, 2.2vw, 22px);
      border-radius: 999px;
      font-size: clamp(18px, 2.4vw, 25px);
      font-weight: 900;
      color: #d97706;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
      border: 3px solid #ffffff;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* Bottom Modes Bar - Tablet & Phone Friendly */
    .bottom-controls-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .modes-scroll {
      pointer-events: auto;
      display: flex;
      gap: clamp(8px, 1.3vw, 14px);
      overflow-x: auto;
      max-width: 100%;
      padding: clamp(7px, 1vw, 10px) clamp(10px, 1.6vw, 16px);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 26px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.15), inset 0 2px 0 #ffffff;
      border: 2.5px solid rgba(255,255,255,0.85);
      scrollbar-width: none;
    }
    .modes-scroll::-webkit-scrollbar { display: none; }
    .mode-btn {
      min-height: 44px;
      padding: clamp(8px, 1.1vw, 12px) clamp(14px, 1.8vw, 20px);
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 18px;
      font-size: clamp(13px, 1.55vw, 16px);
      font-weight: 800;
      color: #334155;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: transform 0.1s, background 0.15s, border-color 0.15s;
    }
    .mode-btn:active { transform: scale(0.94); }
    .mode-btn.active {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-color: #991b1b;
      color: #ffffff;
      box-shadow: 0 5px 14px rgba(220, 38, 38, 0.4);
    }

    /* Reticle */
    #reticle {
      position: absolute;
      width: clamp(58px, 7.5vw, 82px);
      height: clamp(58px, 7.5vw, 82px);
      border: 4px dashed #ef4444;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.55);
      z-index: 40;
      transition: opacity 0.18s ease-out;
    }
    #reticle.visible {
      opacity: 1;
      animation: reticleSpin 2.5s linear infinite;
    }
    #reticle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 11px;
      height: 11px;
      background: #ef4444;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px #ef4444;
    }
    @keyframes reticleSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Non-blocking Level Clear & Next Level Banner */
    #stage-toast {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      padding: clamp(12px, 2vw, 18px) clamp(26px, 4.5vw, 46px);
      border-radius: 999px;
      border: 4px solid #ffffff;
      box-shadow: 0 16px 36px rgba(22, 163, 74, 0.45);
      font-size: clamp(22px, 3.8vw, 36px);
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 3px 0 rgba(0,0,0,0.25);
      pointer-events: none;
      opacity: 0;
      z-index: 55;
      white-space: nowrap;
      transition: opacity 0.25s ease, transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #stage-toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Smooth Level Transition Curtain */
    #transition-curtain {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(219,234,254,0.98) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.24s ease-in-out;
      z-index: 70;
    }
    #transition-curtain.active {
      opacity: 1;
    }

    /* Screen Flash on Heavy Punch */
    #impact-flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.25) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.08s ease-out;
      z-index: 50;
    }

    /* Floating Comic Hit Text (+1, POW!, BAM!) */
    .hit-floating-text {
      position: absolute;
      pointer-events: none;
      font-weight: 900;
      font-size: clamp(24px, 3.8vw, 38px);
      color: #facc15;
      text-shadow: -2px -2px 0 #111827, 2px -2px 0 #111827, -2px 2px 0 #111827, 2px 2px 0 #111827, 0 5px 12px rgba(0,0,0,0.4);
      transform: translate(-50%, -50%);
      z-index: 45;
      animation: floatPop 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes floatPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(-8deg); }
      25% { opacity: 1; transform: translate(-50%, -70%) scale(1.25) rotate(5deg); }
      100% { opacity: 0; transform: translate(-50%, -145%) scale(0.95) rotate(-3deg); }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="impact-flash"></div>
    <div id="transition-curtain"></div>
    <div id="reticle"></div>
    <div id="stage-toast">⭐ NOCAUTE! ⭐</div>

    <div id="ui-layer">
      <div class="top-bar">
        <div class="left-controls">
          <a href="../index.html" class="btn-icon" title="Voltar ao Menu Principal">🏠</a>
          <button id="btn-sound" class="btn-icon" title="Ligar/Desligar Som">🔊</button>
        </div>

        <div class="level-pill">
          <div class="level-num" id="level-display">Level 1</div>
          <div class="level-theme" id="level-theme">Banheiro</div>
        </div>

        <div class="coin-badge">
          <span>🏺</span>
          <span id="coins-count">50</span>
        </div>
      </div>

      <div class="bottom-controls-wrap">
        <div class="modes-scroll" id="modes-bar">
          <button class="mode-btn active" data-mode="normal">🥊 Luva Vermelha</button>
          <button class="mode-btn" data-mode="gold">🏆 Luva Dourada</button>
          <button class="mode-btn" data-mode="turbo">⚡ Mola Supersônica</button>
          <button class="mode-btn" data-mode="heavy">💣 Socão Pesado</button>
          <button class="mode-btn" data-mode="gravity">🌌 Gravidade Zero</button>
          <button class="mode-btn" data-mode="giant">💪 Luva Gigante</button>
        </div>
      </div>
    </div>
  </div>

  <script src="textures.js"></script>
  <script src="ragdoll.js"></script>
  <script src="scenarios.js"></script>
  <script src="game.js"></script>
</body>
</html>
