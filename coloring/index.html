<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Estúdio de Desenho &amp; Colorir</title>
  <script>
    if (location.protocol.indexOf('http') === 0 && !location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #bae6fd 0%, #ddd6fe 50%, #fbcfe8 100%);
      font-family: 'Fredoka', 'Trebuchet MS', sans-serif;
      color: #1e293b;
    }

    .studio-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom)) 10px;
      gap: 8px;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .btn-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-btn {
      border: 3px solid #fff;
      background: linear-gradient(180deg, #fff 0%, #f1f5f9 100%);
      color: #1e293b;
      border-radius: 15px;
      padding: 6px 11px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(13px, 1.9vw, 15px);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 0 rgba(15, 23, 42, 0.16);
      transition: transform 0.1s;
    }
    .hud-btn:active {
      transform: translateY(2px);
    }
    .hud-btn.icon-only {
      width: 42px;
      height: 42px;
      padding: 0;
      justify-content: center;
      font-size: 19px;
    }
    .hud-btn.save-btn {
      background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
      color: #fff;
    }

    /* TEMPLATES STRIP */
    .templates-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.85);
      border: 3px solid #fff;
      border-radius: 18px;
      padding: 6px 8px;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .templates-bar::-webkit-scrollbar { display: none; }
    .tpl-btn {
      border: 2px solid #e2e8f0;
      background: #fff;
      border-radius: 13px;
      padding: 6px 11px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: #334155;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 3px 0 #cbd5e1;
      transition: all 0.1s;
    }
    .tpl-btn.active {
      background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      border-color: #fff;
      box-shadow: 0 3px 0 #3730a3;
    }

    /* MAIN WORKSPACE (CANVAS + PALETTE) */
    .workspace {
      flex: 1 1 auto;
      display: flex;
      gap: 10px;
      min-height: 0;
      min-width: 0;
    }

    .board-stage {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      position: relative;
    }
    .canvas-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc((100vh - 140px) * 900 / 680);
      aspect-ratio: 900 / 680;
      max-height: 100%;
      background: #ffffff;
      border-radius: 22px;
      border: 5px solid #ffffff;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.22);
      overflow: hidden;
    }
    .canvas-frame canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #paint-canvas {
      touch-action: none;
      cursor: crosshair;
      z-index: 1;
    }
    #line-canvas {
      pointer-events: none;
      z-index: 2;
    }

    #save-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.2s ease-out;
    }
    #save-flash.active {
      opacity: 0.85;
    }

    /* TOOLS & COLORS PANEL */
    .side-palette {
      width: 265px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 3px solid #fff;
      border-radius: 22px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.14);
      overflow-y: auto;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
      color: #475569;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .tool-btn {
      border: 2px solid #e2e8f0;
      background: #fff;
      border-radius: 14px;
      padding: 7px 6px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 3px 0 #cbd5e1;
      transition: all 0.1s;
    }
    .tool-btn .icon { font-size: 19px; }
    .tool-btn .label { font-size: 12px; }
    .tool-btn.active {
      background: linear-gradient(180deg, #ec4899 0%, #db2777 100%);
      color: #fff;
      border-color: #fff;
      box-shadow: 0 3px 0 #9d174d;
    }

    .sizes-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .size-btn {
      border: 2px solid #e2e8f0;
      background: #fff;
      border-radius: 12px;
      padding: 6px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 3px 0 #cbd5e1;
    }
    .size-btn.active {
      background: #f59e0b;
      color: #fff;
      border-color: #fff;
      box-shadow: 0 3px 0 #b45309;
    }

    .colors-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .color-btn {
      height: 36px;
      border-radius: 12px;
      border: 3px solid #fff;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.18);
      transition: transform 0.1s;
    }
    .color-btn.active {
      transform: scale(1.14);
      box-shadow: 0 0 0 3px #1e293b, 0 4px 10px rgba(0,0,0,0.28);
    }

    .stamps-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .stamp-btn {
      height: 40px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      background: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #cbd5e1;
    }
    .stamp-btn.active {
      border-color: #db2777;
      background: #fdf2f8;
      transform: scale(1.08);
    }

    .hidden { display: none !important; }

    /* PORTRAIT PHONES & NARROW TABLETS */
    @media (max-width: 780px) {
      .workspace {
        flex-direction: column;
      }
      .canvas-frame {
        max-width: 100%;
      }
      .side-palette {
        width: 100%;
        max-height: 225px;
        flex-shrink: 0;
        gap: 7px;
        padding: 8px;
      }
      .tools-grid {
        grid-template-columns: repeat(4, 1fr);
      }
      .tool-btn {
        flex-direction: column;
        gap: 2px;
        padding: 5px 2px;
      }
      .tool-btn .label { font-size: 10px; }
      .colors-grid {
        grid-template-columns: repeat(7, 1fr);
      }
      .color-btn {
        height: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="studio-shell">
    <!-- Top Controls -->
    <div class="top-bar">
      <div class="btn-row">
        <a href="../index.html" class="hud-btn icon-only" title="Voltar ao Menu Principal">🏠</a>
        <button id="btn-sound" type="button" class="hud-btn icon-only" title="Ligar/Desligar Som">🔊</button>
      </div>
      <div class="btn-row">
        <button id="btn-undo" type="button" class="hud-btn">↩️ Desfazer</button>
        <button id="btn-clear" type="button" class="hud-btn">🗑️ Limpar</button>
        <button id="btn-save" type="button" class="hud-btn save-btn">💾 Salvar</button>
      </div>
    </div>

    <!-- Templates Carousel -->
    <div id="templates-bar" class="templates-bar"></div>

    <!-- Drawing Board + Side Palette -->
    <div class="workspace">
      <div class="board-stage">
        <div class="canvas-frame">
          <canvas id="paint-canvas"></canvas>
          <canvas id="line-canvas"></canvas>
          <div id="save-flash"></div>
        </div>
      </div>

      <aside class="side-palette">
        <div class="panel-title">🖌️ Ferramentas</div>
        <div id="tools-grid" class="tools-grid"></div>

        <div class="panel-title">📏 Tamanho</div>
        <div id="sizes-row" class="sizes-row"></div>

        <div class="panel-title">🎨 Cores / Carimbos</div>
        <div id="colors-wrap" class="colors-grid"></div>
        <div id="stamps-wrap" class="stamps-grid hidden"></div>
      </aside>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="templates.js"></script>
  <script src="game.js"></script>
</body>
</html>
