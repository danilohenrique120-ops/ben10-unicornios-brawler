<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Salão de Manicure Kids</title>
  <script>
    if (location.protocol.indexOf('http') === 0 && !location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #ffe4e6 0%, #fbcfe8 50%, #f3e8ff 100%);
      font-family: 'Fredoka', 'Trebuchet MS', sans-serif;
      color: #4c0519;
    }

    .salon-layout {
      display: flex;
      width: 100%;
      height: 100%;
      flex-direction: row;
    }

    /* MAIN HAND CANVAS AREA */
    .hand-panel {
      flex: 1 1 auto;
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .top-overlay {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      gap: 8px;
    }
    .top-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .hud-btn {
      border: 3px solid #fff;
      background: linear-gradient(180deg, #fff 0%, #fff1f2 100%);
      color: #881337;
      border-radius: 16px;
      padding: 7px 12px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(13px, 1.9vw, 15px);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 0 rgba(136, 19, 55, 0.2), 0 6px 14px rgba(0,0,0,0.12);
      transition: transform 0.1s;
    }
    .hud-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(136, 19, 55, 0.2);
    }
    .hud-btn.icon-only {
      width: 44px;
      height: 44px;
      padding: 0;
      justify-content: center;
      font-size: 20px;
    }
    .hud-btn.photo {
      background: linear-gradient(180deg, #f472b6 0%, #db2777 100%);
      color: #fff;
    }
    .hud-btn.active {
      background: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%);
      color: #fff;
    }

    #hand-stage {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 62px 12px 48px 12px;
      min-height: 0;
    }
    .hand-frame {
      height: 100%;
      max-height: 100%;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 26px;
      padding: 7px;
      background: linear-gradient(135deg, #fffbeb 0%, #fde68a 45%, #fbcfe8 100%);
      box-shadow: 0 14px 34px rgba(136, 19, 55, 0.22), inset 0 2px 6px rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #manicure-canvas {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      display: block;
      touch-action: none;
      cursor: none;
      background: #fce7f3;
    }

    .hint-pill {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #fff;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: clamp(12px, 1.8vw, 14px);
      font-weight: 700;
      color: #881337;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      white-space: nowrap;
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      z-index: 15;
    }

    /* SIDE SALON TOOLKIT PANEL */
    .side-menu {
      width: 310px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-left: 4px solid #fff;
      box-shadow: -8px 0 28px rgba(136, 19, 55, 0.14);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      z-index: 25;
      overflow-y: auto;
    }

    .menu-header {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: #be185d;
      letter-spacing: 0.3px;
    }

    .menu-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .tab-btn {
      border: 2px solid #fbcfe8;
      background: #fff1f2;
      border-radius: 14px;
      padding: 7px 4px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 12px;
      color: #9d174d;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      box-shadow: 0 3px 0 #f9a8d4;
      transition: all 0.1s;
    }
    .tab-btn span:first-child {
      font-size: 19px;
    }
    .tab-btn.active {
      background: linear-gradient(180deg, #ec4899 0%, #db2777 100%);
      color: #fff;
      border-color: #fff;
      box-shadow: 0 3px 0 #9d174d;
    }

    .menu-content {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .tool-card-btn {
      border: 3px solid #fce7f3;
      background: #ffffff;
      border-radius: 18px;
      padding: 12px 8px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      color: #881337;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 4px 0 #fbcfe8;
      transition: transform 0.1s;
    }
    .tool-card-btn:active {
      transform: translateY(2px);
    }
    .tool-card-btn.active {
      background: linear-gradient(180deg, #fdf2f8 0%, #fce7f3 100%);
      border-color: #db2777;
      box-shadow: 0 4px 0 #db2777, 0 0 0 2px rgba(219, 39, 119, 0.25);
    }
    .tool-card-btn .t-icon {
      font-size: 28px;
    }
    .tool-card-btn .t-name {
      font-size: 13px;
    }

    .sub-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .mini-pill {
      border: 2px solid #fbcfe8;
      background: #fff;
      color: #881337;
      border-radius: 12px;
      padding: 6px 10px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 2px 0 #f9a8d4;
    }
    .mini-pill.active {
      background: #db2777;
      color: #fff;
      border-color: #fff;
      box-shadow: 0 2px 0 #831843;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      padding: 4px;
    }
    .polish-swatch {
      height: 48px;
      border-radius: 14px;
      border: 3px solid #fff;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.16);
      transition: transform 0.12s;
      display: flex;
      justify-content: center;
    }
    .bottle-cap {
      position: absolute;
      top: -6px;
      width: 18px;
      height: 10px;
      border-radius: 4px 4px 2px 2px;
      background: #1e293b;
      border: 2px solid #fff;
    }
    .polish-swatch.active {
      transform: scale(1.12);
      box-shadow: 0 0 0 3px #db2777, 0 6px 12px rgba(0,0,0,0.22);
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }
    .sticker-btn {
      height: 46px;
      border-radius: 14px;
      border: 2px solid #fbcfe8;
      background: #fff;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #fbcfe8;
    }
    .sticker-btn.active {
      border-color: #db2777;
      background: #fdf2f8;
      transform: scale(1.08);
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: #9d174d;
      margin-top: 2px;
    }
    .skin-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid #fff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .skin-dot.active {
      box-shadow: 0 0 0 3px #db2777, 0 3px 8px rgba(0,0,0,0.25);
      transform: scale(1.12);
    }

    /* PORTRAIT PHONES / NARROW TABLETS */
    @media (max-width: 760px) {
      .salon-layout {
        flex-direction: column;
      }
      .side-menu {
        width: 100%;
        height: 41%;
        max-height: 280px;
        border-left: none;
        border-top: 4px solid #fff;
        box-shadow: 0 -8px 24px rgba(136, 19, 55, 0.14);
        padding: 8px 10px;
        gap: 8px;
      }
      .menu-header {
        display: none;
      }
      .tool-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .tool-card-btn {
        padding: 8px 4px;
      }
      .tool-card-btn .t-icon {
        font-size: 22px;
      }
      .color-grid {
        grid-template-columns: repeat(6, 1fr);
      }
      .polish-swatch {
        height: 38px;
      }
    }
  </style>
</head>
<body>
  <div class="salon-layout">
    <!-- Left / Top Interactive Hand Stage -->
    <div class="hand-panel">
      <div class="top-overlay">
        <div class="top-group">
          <a href="../index.html" class="hud-btn icon-only" title="Voltar ao Menu Principal">🏠</a>
          <button id="btn-sound" type="button" class="hud-btn icon-only" title="Ligar/Desligar Som">🔊</button>
          <button id="btn-guide" type="button" class="hud-btn" title="Mostrar/Esconder Guia Tracejado">🎯 Guia</button>
        </div>
        <div class="top-group">
          <button id="btn-new-hand" type="button" class="hud-btn">🔄 Novas Unhas</button>
          <button id="btn-photo" type="button" class="hud-btn photo">📸 Foto!</button>
        </div>
      </div>

      <div id="hand-stage">
        <div class="hand-frame">
          <canvas id="manicure-canvas"></canvas>
        </div>
      </div>

      <div id="tool-hint-text" class="hint-pill">🫧 Esponja: Esfregue nas unhas para limpar com espuma!</div>
    </div>

    <!-- Side Toolkit Menus -->
    <aside class="side-menu">
      <div class="menu-header">💅 Salão de Manicure</div>
      <div id="menu-tabs" class="menu-tabs"></div>
      <div id="menu-content" class="menu-content"></div>
    </aside>
  </div>

  <script src="audio.js"></script>
  <script src="tools.js"></script>
  <script src="game.js"></script>
</body>
</html>
